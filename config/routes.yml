# SmartBulk — Symfony routes (PS 8/9 compatible)
# _legacy_controller defaults map the legacy Tab class_name to the Symfony route,
# so clicking "AdminSmartBulk" in BO menu lands on the Symfony controller.

smartbulk_index:
    path: /smartbulk
    methods: [GET]
    defaults:
        _controller: 'SmartBulk\Controller\AdminSmartBulkController::indexAction'
        _legacy_controller: AdminSmartBulk

smartbulk_grid_handoff:
    path: /smartbulk/grid-handoff
    methods: [POST, GET]
    defaults:
        _controller: 'SmartBulk\Controller\AdminSmartBulkController::gridHandoffAction'
        _legacy_controller: AdminSmartBulk

smartbulk_ai_handoff:
    path: /smartbulk/ai-handoff
    methods: [GET]
    defaults:
        _controller: 'SmartBulk\Controller\AdminSmartBulkController::aiHandoffAction'
        _legacy_controller: AdminSmartBulk

